# Included in every location: nginx drops server-level add_header lines in any location that
# sets its own add_header, so these must be repeated wherever headers are added.
# Strict browser policy: only our own scripts may run and the page may only call its own origin,
# which limits what an injected script could do with the API key held in sessionStorage.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
