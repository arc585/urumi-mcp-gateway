{{- if and .Values.gateway.enabled (not .Values.gateway.existingSecret) }}
{{- /*
Generated gateway credentials; `lookup` keeps them stable across upgrades (see store-secret.yaml).
- api-key-pepper: HMAC secret for hashing member API keys (a DB dump alone cannot test keys).
- upstream-encryption-key: Fernet key encrypting upstream credentials at rest in Postgres.
- bootstrap-admin-key: the first admin's API key (read it with kubectl; rotate in the dashboard).
- shipping-token: the demo shipping server's own credential, known only to it and the gateway.
*/}}
{{- $name := include "urumi.componentName" (list . "gateway") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
{{- $fernet := randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "urumi.labels" (list . "gateway") | nindent 4 }}
  annotations:
    # Losing these would make stored keys and encrypted credentials unusable, so keep on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-key-pepper: {{ include "urumi.secretValue" (list $data "api-key-pepper" (randAlphaNum 48)) }}
  upstream-encryption-key: {{ include "urumi.secretValue" (list $data "upstream-encryption-key" $fernet) }}
  bootstrap-admin-key: {{ include "urumi.secretValue" (list $data "bootstrap-admin-key" (printf "urm_%s" (randAlphaNum 43))) }}
  postgres-password: {{ include "urumi.secretValue" (list $data "postgres-password" (randAlphaNum 32)) }}
  shipping-token: {{ include "urumi.secretValue" (list $data "shipping-token" (randAlphaNum 40)) }}
{{- end }}
