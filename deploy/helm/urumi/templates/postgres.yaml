{{- if .Values.gateway.enabled }}
{{- $name := include "urumi.componentName" (list . "postgres") }}
{{- $pg := .Values.postgres }}
{{- $secret := include "urumi.gatewaySecretName" . }}
# The gateway's own database: users, hashed API keys, encrypted upstream credentials, audit log.
# Separate from the store's MariaDB: a different trust domain with different data.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "urumi.labels" (list . "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "urumi.selectorLabels" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "urumi.labels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "urumi.selectorLabels" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "urumi.selectorLabels" (list . "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The alpine image's "postgres" user.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: postgres-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}, "-h", "127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}, "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "urumi.selectorLabels" (list . "postgres") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- if .Values.networkPolicies.enabled }}
---
# Only the gateway may connect to its database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "urumi.labels" (list . "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi.selectorLabels" (list . "postgres") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (list . "gateway") | nindent 14 }}
        {{- if .Values.backups.enabled }}
        - podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (list . "backup") | nindent 14 }}
        {{- end }}
      ports:
        - port: postgres
{{- end }}
{{- end }}
