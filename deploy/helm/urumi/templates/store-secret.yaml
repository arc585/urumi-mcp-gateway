{{- if and .Values.store.enabled (not .Values.store.existingSecret) }}
{{- /*
Generated store credentials. `lookup` reads the Secret already in the cluster (if any), so
`helm upgrade` keeps the same passwords instead of generating new ones that would no longer
match what MariaDB and WordPress were initialised with. (`helm template` has no cluster access,
so it always shows fresh random values.)
*/}}
{{- $name := include "urumi.componentName" (list . "store") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "urumi.labels" (list . "store") | nindent 4 }}
  annotations:
    # Keep this Secret if the release is uninstalled: the database volume still holds data
    # created with these passwords, and a reinstall must reuse them.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ include "urumi.secretValue" (list $data "mariadb-root-password" (randAlphaNum 32)) }}
  mariadb-password: {{ include "urumi.secretValue" (list $data "mariadb-password" (randAlphaNum 32)) }}
  wordpress-admin-password: {{ include "urumi.secretValue" (list $data "wordpress-admin-password" (randAlphaNum 20)) }}
  # WooCommerce REST API key pair used only by the WooCommerce MCP server.
  woocommerce-consumer-key: {{ include "urumi.secretValue" (list $data "woocommerce-consumer-key" (printf "ck_%s" (randAlphaNum 40 | sha1sum))) }}
  woocommerce-consumer-secret: {{ include "urumi.secretValue" (list $data "woocommerce-consumer-secret" (printf "cs_%s" (randAlphaNum 40 | sha1sum))) }}
{{- end }}
