# cert-manager ClusterIssuer for Let's Encrypt (production). Apply once per cluster:
#   kubectl apply -f deploy/k3s/cluster-issuer.yaml
# Replace the email: Let's Encrypt sends certificate-expiry notices there.
# HTTP-01 challenge: Let's Encrypt fetches a token over http://<host>/.well-known/acme-challenge/...
# through Traefik, so ports 80/443 must be open and DNS must already point at the VPS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
