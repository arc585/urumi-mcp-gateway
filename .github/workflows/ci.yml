# CI: tests + chart checks on every push/PR; multi-arch images to GHCR on version tags (v0.7.0 → :0.7.0).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock pytest
      - run: python -m pytest services/gateway/tests -q
      - run: python -m pytest services/woocommerce-mcp/tests -q
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/helm/urumi -f deploy/helm/urumi/values-local.yaml
          helm lint deploy/helm/urumi -f deploy/helm/urumi/values-prod.yaml
          helm template urumi deploy/helm/urumi -n urumi -f deploy/helm/urumi/values-prod.yaml > /dev/null
      - name: Release consistency (production image tags == Chart appVersion)
        run: |
          app=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/urumi/Chart.yaml)
          tags=$(sed -n 's/^ *tag: "\([^"]*\)".*/\1/p' deploy/helm/urumi/values-prod.yaml | sort -u)
          echo "appVersion=$app  values-prod tags=$tags"
          [ "$tags" = "$app" ] || { echo "values-prod.yaml image tags must all equal Chart appVersion"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci && npm run build

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: urumi-gateway, dockerfile: services/gateway/Dockerfile }
          - { name: urumi-woocommerce-mcp, dockerfile: services/woocommerce-mcp/Dockerfile }
          - { name: urumi-demo-mcp, dockerfile: services/demo-mcp/Dockerfile }
          - { name: urumi-dashboard, dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag from the git tag (GHCR names must be lowercase)
        id: tag
        run: |
          app=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/urumi/Chart.yaml)
          [ "${GITHUB_REF_NAME#v}" = "$app" ] || { echo "git tag $GITHUB_REF_NAME must be v$app (Chart appVersion)"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.owner }}/${{ matrix.name }}:${{ steps.tag.outputs.version }}
