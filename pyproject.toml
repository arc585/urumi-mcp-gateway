[project]
name = "urumi-mcp-gateway"
version = "0.1.0"
description = "WooCommerce hosting with a team MCP gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mcp[cli]>=2.0,<3",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "cryptography>=44,<47",
  "openai>=2.0,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
