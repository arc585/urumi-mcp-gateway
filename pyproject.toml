[project]
name = "urumi-mcp-gateway"
version = "0.1.0"
description = "WooCommerce hosting with a team MCP gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mcp[cli]>=2.0,<3",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "cryptography>=44,<47",
  "openai>=2.0,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberate catch-alls sit at isolation boundaries (one failed upstream, housekeeping, scripts that must
# clean up) and are explained inline; nested `async with` blocks read better than combined ones here.
ignore = ["BLE001", "SIM117"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection puts calls in default arguments on purpose.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Tests block the loop with sync HTTP calls on purpose (the server is another process) and catch
# whatever an MCP client raises for a revoked key.
"**/tests/*" = ["ASYNC210", "B017"]
